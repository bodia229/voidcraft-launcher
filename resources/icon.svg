<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#1a0606"/>
      <stop offset="60%" stop-color="#0a0303"/>
      <stop offset="100%" stop-color="#040101"/>
    </radialGradient>
    <linearGradient id="blood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <linearGradient id="bloodSoft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#991b1b" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="hardGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- background plate -->
  <rect width="512" height="512" rx="92" fill="url(#bg)"/>

  <!-- subtle outer frame -->
  <rect x="6" y="6" width="500" height="500" rx="88" fill="none" stroke="#1f0707" stroke-width="2" opacity="0.7"/>

  <!-- ambient blood-red glow under everything -->
  <g transform="translate(256 256)" opacity="0.55">
    <circle r="150" fill="url(#bloodSoft)" filter="url(#glow)" opacity="0.18"/>
  </g>

  <!-- outer cracked ring -->
  <g transform="translate(256 256)" filter="url(#glow)">
    <!-- main ring built from arcs with gaps = cracks -->
    <g fill="none" stroke="url(#blood)" stroke-width="6" stroke-linecap="round">
      <!-- top-left arc 200deg to 350deg -->
      <path d="M -159 -55  A 168 168 0 0 1 -55 -159"/>
      <path d="M -25 -166  A 168 168 0 0 1  88 -143"/>
      <path d="M 120 -117 A 168 168 0 0 1  166  -22"/>
      <path d="M 163  22  A 168 168 0 0 1  108  129"/>
      <path d="M  70  153 A 168 168 0 0 1 -36  164"/>
      <path d="M -75  151 A 168 168 0 0 1 -154  64"/>
    </g>

    <!-- inner thin ring (broken too) -->
    <g fill="none" stroke="url(#bloodSoft)" stroke-width="2.5" stroke-linecap="round" opacity="0.7">
      <path d="M -130 -30  A 134 134 0 0 1  -30 -130"/>
      <path d="M  20 -132  A 134 134 0 0 1  130 -25"/>
      <path d="M 130  25  A 134 134 0 0 1   25  131"/>
      <path d="M -30 130  A 134 134 0 0 1 -130  30"/>
    </g>

    <!-- crack shards spilling outward -->
    <g stroke="url(#blood)" stroke-width="3" stroke-linecap="round" opacity="0.9">
      <line x1="-168" y1="-58" x2="-188" y2="-78"/>
      <line x1="92" y1="-145" x2="108" y2="-168"/>
      <line x1="165" y1="-26" x2="190" y2="-30"/>
      <line x1="110" y1="130" x2="130" y2="153"/>
      <line x1="-38" y1="167" x2="-44" y2="190"/>
      <line x1="-156" y1="62" x2="-180" y2="74"/>
    </g>
  </g>

  <!-- central void diamond + blood crack down the middle -->
  <g transform="translate(256 256)" filter="url(#hardGlow)">
    <!-- void core (almost black) with red edge -->
    <g transform="rotate(45)">
      <rect x="-58" y="-58" width="116" height="116" rx="8" fill="#070202" stroke="url(#blood)" stroke-width="4"/>
      <rect x="-58" y="-58" width="116" height="116" rx="8" fill="none" stroke="#fca5a5" stroke-width="1" opacity="0.35"/>
    </g>

    <!-- vertical crack through the diamond -->
    <g stroke="url(#blood)" stroke-width="3" stroke-linecap="round" fill="none">
      <path d="M 0 -82  L -4 -55  L 6 -28  L -3 0  L 5 28  L -4 55  L 3 82"/>
    </g>

    <!-- tiny offshoot crack -->
    <g stroke="#f87171" stroke-width="2" stroke-linecap="round" opacity="0.75" fill="none">
      <path d="M -3 0 L -28 -16"/>
      <path d="M 3 30 L 22 42"/>
    </g>

    <!-- core hot spot -->
    <circle r="6" fill="#fca5a5"/>
    <circle r="10" fill="none" stroke="#ef4444" stroke-width="1" opacity="0.7"/>
  </g>

  <!-- corner runes (4 small marks) -->
  <g fill="url(#blood)" opacity="0.55">
    <rect x="36" y="36" width="14" height="2"/>
    <rect x="36" y="36" width="2" height="14"/>
    <rect x="462" y="36" width="14" height="2"/>
    <rect x="474" y="36" width="2" height="14"/>
    <rect x="36" y="474" width="14" height="2"/>
    <rect x="36" y="462" width="2" height="14"/>
    <rect x="462" y="474" width="14" height="2"/>
    <rect x="474" y="462" width="2" height="14"/>
  </g>
</svg>
